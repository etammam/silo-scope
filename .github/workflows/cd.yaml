name: Continuous Delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-core:
    name: Publish Core (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-x64
          - osx-x64
          - osx-arm64
          - win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore src/Siloscope.Core/Siloscope.Core.csproj --runtime ${{ matrix.runtime }} --verbosity minimal

      - name: Publish self-contained sidecar
        run: >
          dotnet publish src/Siloscope.Core/Siloscope.Core.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          --output artifacts/core/${{ matrix.runtime }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: siloscope-core-${{ matrix.runtime }}
          path: artifacts/core/${{ matrix.runtime }}
          retention-days: 7

  build-desktop:
    name: Package Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            runtime: linux-x64
            dist-script: dist:linux
          - os: macos-latest
            name: macos-arm64
            runtime: osx-arm64
            dist-script: dist:mac
          - os: windows-latest
            name: win-x64
            runtime: win-x64
            dist-script: dist:win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/silo-scope/package-lock.json

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2

      - name: Download Core sidecar
        uses: actions/download-artifact@v4
        with:
          name: siloscope-core-${{ matrix.runtime }}
          path: src/silo-scope/resources/core

      - name: Install dependencies
        working-directory: src/silo-scope
        run: npm ci

      - name: Package Electron app
        working-directory: src/silo-scope
        run: npm run ${{ matrix.dist-script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload distributable packages
        uses: actions/upload-artifact@v4
        with:
          name: siloscope-desktop-${{ matrix.name }}
          path: src/silo-scope/dist/
          retention-days: 7

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Semantic Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -p semantic-release -p @semantic-release/changelog -p @semantic-release/git -p conventional-changelog-conventionalcommits semantic-release
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Attach packages to release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          for artifact_dir in siloscope-desktop-*/; do
            find "$artifact_dir" -type f -exec gh release upload "${{ steps.release.outputs.tag }}" {} +
          done
