name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and Test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "cache-key=${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}" >> $GITHUB_OUTPUT
          echo "tools-cache-key=${{ runner.os }}-dotnet-tools-${{ hashFiles('**/.config/dotnet-tools.json', '**/*.csproj') }}" >> $GITHUB_OUTPUT

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: ${{ steps.cache-keys.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache dotnet tools
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.dotnet/tools
            ~/.dotnet/tools
          key: ${{ steps.cache-keys.outputs.tools-cache-key }}
          restore-keys: |
            ${{ runner.os }}-dotnet-tools-

      - name: Install global tools
        run: dotnet tool restore --verbosity minimal

      - name: Restore dependencies
        run: dotnet restore --verbosity minimal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore --verbosity minimal

      - name: Unit Testing with Coverage
        run: |
          dotnet tool install -g dotnet-coverage --verbosity minimal
          dotnet test --no-build --no-restore --verbosity normal --configuration Release \
            --settings coverage.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/coverage

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-results-${{ github.run_number }}
          path: ./TestResults/coverage
          retention-days: 30

  build-desktop:
    name: Build Desktop (Typecheck + Compile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/silo-scope/package-lock.json

      - name: Install dependencies
        working-directory: src/silo-scope
        run: npm ci

      - name: Typecheck
        working-directory: src/silo-scope
        run: npm run typecheck

      - name: Verify desktop compiles
        working-directory: src/silo-scope
        run: npm run build
